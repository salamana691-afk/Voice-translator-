apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: autodub-cloud-backend
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 40
      timeoutSeconds: 60
      containers:
        - image: gcr.io/PROJECT_ID/autodub-cloud-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: NODE_ENV
              value: production
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: autodub-gemini-api-key
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
